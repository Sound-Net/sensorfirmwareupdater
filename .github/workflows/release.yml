name: Build installers

# Produces the installers researchers download. jpackage is not a cross-compiler:
# a Windows installer can only be built on Windows, which is why this runs on a
# matrix rather than on one machine.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_type: msi
            artifact: SoundNetFirmwareUpdater-windows
            icon: src/main/installer/icon.ico
          - os: macos-latest
            package_type: dmg
            artifact: SoundNetFirmwareUpdater-macos
            icon: src/main/installer/icon.icns
          - os: ubuntu-latest
            package_type: deb
            artifact: SoundNetFirmwareUpdater-linux
            icon: src/main/installer/icon.png

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # WiX 3 provides the .msi backend that jpackage shells out to, and the
      # Burn bootstrapper backend for --type exe (see pom.xml's "win" profile,
      # wix-exe-installer execution) - both come from the same toolset, no
      # extra extensions to install.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version=3.14.1 --no-progress -y
        shell: pwsh

      # On Windows this also builds target/dist/app-image (self-contained
      # folder) and target/dist/installer/*.exe (single-file WiX/Burn
      # installer, bundled JRE included) automatically - see the "win" profile
      # in pom.xml.
      - name: Build and test
        run: mvn -B package

      - name: Package installer
        shell: bash
        run: |
          jpackage \
            --type ${{ matrix.package_type }} \
            --name "SoundNet Firmware Updater" \
            --app-version 1.0.0 \
            --vendor "SoundNet" \
            --input target/app \
            --main-jar sensor-firmware-updater.jar \
            --main-class org.soundnet.flasher.Main \
            --icon "${{ matrix.icon }}" \
            --dest target/installer \
            $EXTRA
        env:
          # --win-per-user-install keeps the .msi in step with the NSIS
          # installer: installs under the user's own profile, no admin
          # rights and no UAC prompt.
          EXTRA: ${{ runner.os == 'Windows' && '--win-shortcut --win-menu --win-dir-chooser --win-per-user-install' || '' }}

      # A plain unzip-and-run build, for anyone who cannot run an installer -
      # locked-down institutional laptops are common in this audience.
      - name: Package portable app image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name "SoundNet Firmware Updater" \
            --app-version 1.0.0 \
            --input target/app \
            --main-jar sensor-firmware-updater.jar \
            --main-class org.soundnet.flasher.Main \
            --icon "${{ matrix.icon }}" \
            --dest target/portable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/installer/*
            target/portable/*
            target/dist/installer/*
